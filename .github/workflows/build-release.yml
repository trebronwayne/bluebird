name: Build Signed Release APK

# How releases work
# ─────────────────
# Run this workflow manually (Actions → Build Signed Release APK → Run workflow). Two ways to release:
#
#   TYPE A VERSION   Put e.g. 2.4.1 in the "version" box (2.5 means 2.5.0). It must be higher than the
#                    latest tag. The build number (versionCode) is separate: it goes up by 1 on every release.
#   OR PICK A TYPE   Leave "version" blank and choose a release type:
#
#   none     Build + sign an APK as a CI artifact only. No tag, no release. (Same as every push.)
#   baseline Create the 2.4.0 tag ONLY (from your current version.properties) and stop.
#            Use `baseline_ref` to point it at the commit where you stopped releasing.
#   patch    2.4.0 -> 2.4.1   bug fixes
#   minor    2.4.1 -> 2.5.0   new features
#   major    2.5.0 -> 3.0.0   big / breaking changes
#
# For a typed version or patch/minor/major the workflow: finds the latest X.Y.Z tag (creating the 2.4.0 baseline tag
# first if the repo has none), bumps it, writes version.properties (versionName + versionCode),
# commits it, tags it, builds the APK signed with YOUR keystore secrets, verifies the signature,
# and publishes a GitHub Release with the APK attached.
#
# About "verified" tags/commits: the APK is signed with your Android keystore (the same
# KEYSTORE_* secrets as before) — that has nothing to do with git tag signing. The tag and the
# version commit are created by github-actions[bot]; they are unsigned. That is fine unless a
# branch ruleset requires signed commits, in which case the bot's version commit cannot be pushed;
# the workflow then still tags and releases the build (the tag points at the bot's commit).

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, e.g. 2.4.1 (blank = use the release type below)"
        type: string
        required: false
      release_type:
        description: "Release type, used when version is blank (none = CI build only)"
        type: choice
        default: none
        options: [ none, baseline, patch, minor, major ]
      baseline_ref:
        description: "baseline/first release only: commit SHA or branch where 2.4 was last released (blank = current commit)"
        type: string
        required: false
      prerelease:
        description: "Mark the GitHub release as a pre-release"
        type: boolean
        default: false
      notes:
        description: "Release notes (blank = auto-generated from commits)"
        type: string
        required: false

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build Signed Release APK
    runs-on: ubuntu-latest
    # Fork PRs have no access to signing secrets.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository

    steps:
      - name: Checkout repository (full history + tags)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compute version
        id: ver
        env:
          RELEASE_TYPE: ${{ github.event.inputs.release_type || 'none' }}
          VERSION_INPUT: ${{ github.event.inputs.version }}
          # The build number of your last published release (Uptodown). The next release is this + 1.
          MIN_PUBLISHED_BUILD: 15
          BASELINE_REF: ${{ github.event.inputs.baseline_ref }}
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch --tags --force

          # Current version from version.properties, normalised to X.Y.Z (2.4 -> 2.4.0)
          cur_name=$(grep -E '^versionName=' version.properties | cut -d= -f2 | tr -d '[:space:]')
          IFS=. read -r b_major b_minor b_patch <<< "$cur_name"
          baseline="${b_major:-0}.${b_minor:-0}.${b_patch:-0}"

          latest=$( (git tag --list | grep -E '^v?[0-9]+\.[0-9]+\.[0-9]+$' | sed 's/^v//' | sort -V | tail -n1) || true )

          # A typed version wins over the release type.
          VERSION_INPUT=$(echo "${VERSION_INPUT:-}" | tr -d '[:space:]')
          VERSION_INPUT="${VERSION_INPUT#v}"
          if [ -n "$VERSION_INPUT" ]; then
            RELEASE_TYPE="custom"
          fi

          create_baseline_tag() {
            local ref="${BASELINE_REF:-HEAD}"
            local sha
            sha=$(git rev-parse --verify "${ref}^{commit}")
            echo "Creating baseline tag ${baseline} at ${sha}"
            git tag -a "${baseline}" "${sha}" -m "Baseline ${baseline} (version before automated releases)"
            git push origin "refs/tags/${baseline}"
          }

          if [ -z "$latest" ]; then
            echo "No semantic-version tag found."
            if [ "$RELEASE_TYPE" = "baseline" ] || [ "$RELEASE_TYPE" = "patch" ] || [ "$RELEASE_TYPE" = "minor" ] || [ "$RELEASE_TYPE" = "major" ]; then
              create_baseline_tag
              latest="$baseline"
            fi
          elif [ "$RELEASE_TYPE" = "baseline" ]; then
            echo "Tag ${latest} already exists, nothing to do for baseline."
          fi

          if [ "$RELEASE_TYPE" = "baseline" ]; then
            echo "release=false"   >> "$GITHUB_OUTPUT"
            echo "skip_build=true" >> "$GITHUB_OUTPUT"
            echo "### Baseline tag ready: ${latest:-$baseline}" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          if [ "$RELEASE_TYPE" = "none" ]; then
            echo "release=false"   >> "$GITHUB_OUTPUT"
            echo "skip_build=false" >> "$GITHUB_OUTPUT"
            echo "name=${cur_name}" >> "$GITHUB_OUTPUT"
            echo "code=$(grep -E '^versionCode=' version.properties | cut -d= -f2 | tr -d '[:space:]')" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "$RELEASE_TYPE" = "custom" ]; then
            if ! [[ "$VERSION_INPUT" =~ ^[0-9]+\.[0-9]+(\.[0-9]+)?$ ]]; then
              echo "::error::Version must look like 2.4.1 (or 2.5). You typed: ${VERSION_INPUT}"; exit 1
            fi
            IFS=. read -r major minor patch <<< "$VERSION_INPUT"
            patch="${patch:-0}"
          else
            IFS=. read -r major minor patch <<< "$latest"
            case "$RELEASE_TYPE" in
              patch) patch=$((10#$patch + 1)) ;;
              minor) minor=$((10#$minor + 1)); patch=0 ;;
              major) major=$((10#$major + 1)); minor=0; patch=0 ;;
            esac
          fi
          # Drop leading zeros (2.04.1 -> 2.4.1).
          major=$((10#$major)); minor=$((10#$minor)); patch=$((10#$patch))
          new_name="${major}.${minor}.${patch}"

          # Build number (versionCode): one more than the highest build number used so far, on every release.
          # "Used so far" is the larger of the floor below (your last published build) and the number
          # recorded in the release tags, e.g. "Bluebird 2.4.1 (build 16)". version.properties is not used for
          # this, so an old or overwritten copy of that file can never make the build number jump or go back.
          tag_code=$( (git for-each-ref refs/tags --format='%(contents:subject)' | grep -oE '\(build [0-9]+\)' | grep -oE '[0-9]+' | sort -n | tail -n1) || true )
          base_code="${MIN_PUBLISHED_BUILD}"
          if [[ "${tag_code:-}" =~ ^[0-9]+$ ]] && [ "$((10#$tag_code))" -gt "$base_code" ]; then
            base_code=$((10#$tag_code))
          fi
          new_code=$(( base_code + 1 ))

          # A release must move forward: higher than the latest tag.
          if [ -n "$latest" ] && [ "$latest" != "$new_name" ]; then
            top=$(printf '%s\n%s\n' "$latest" "$new_name" | sort -V | tail -n1)
            if [ "$top" != "$new_name" ]; then
              echo "::error::Version ${new_name} is lower than the latest release ${latest}."; exit 1
            fi
          fi

          if git rev-parse -q --verify "refs/tags/${new_name}" >/dev/null; then
            echo "::error::Tag ${new_name} already exists."; exit 1
          fi

          echo "Latest tag ${latest:-none} -> ${RELEASE_TYPE} -> ${new_name} (versionCode ${new_code})"
          echo "release=true"      >> "$GITHUB_OUTPUT"
          echo "skip_build=false"  >> "$GITHUB_OUTPUT"
          echo "name=${new_name}"  >> "$GITHUB_OUTPUT"
          echo "code=${new_code}"  >> "$GITHUB_OUTPUT"
          echo "previous=${latest}" >> "$GITHUB_OUTPUT"

      - name: Write version.properties, commit and tag
        if: steps.ver.outputs.release == 'true'
        env:
          NEW_NAME: ${{ steps.ver.outputs.name }}
          NEW_CODE: ${{ steps.ver.outputs.code }}
        run: |
          set -euo pipefail
          sed -i "s/^versionName=.*/versionName=${NEW_NAME}/" version.properties
          sed -i "s/^versionCode=.*/versionCode=${NEW_CODE}/" version.properties
          git add version.properties
          git commit -m "Release ${NEW_NAME} [skip ci]"
          git tag -a "${NEW_NAME}" -m "Bluebird ${NEW_NAME} (build ${NEW_CODE})"
          # Keep the branch in sync for local builds; tolerate protected branches.
          git push origin "HEAD:${GITHUB_REF_NAME}" || echo "::warning::Could not push the version commit to ${GITHUB_REF_NAME} (branch protection?). The tag still carries it."
          git push origin "refs/tags/${NEW_NAME}"

      - name: Set up JDK 21
        if: steps.ver.outputs.skip_build != 'true'
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        if: steps.ver.outputs.skip_build != 'true'
        run: chmod +x gradlew

      - name: Decode keystore
        if: steps.ver.outputs.skip_build != 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 -d > release.keystore

      - name: Decode google-services.json
        if: steps.ver.outputs.skip_build != 'true'
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: echo "$GOOGLE_SERVICES_JSON_BASE64" | base64 -d > app/google-services.json

      - name: Build signed release APK
        if: steps.ver.outputs.skip_build != 'true'
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          V_NAME: ${{ steps.ver.outputs.name }}
          V_CODE: ${{ steps.ver.outputs.code }}
        run: ./gradlew assembleRelease --stacktrace -PversionNameOverride="$V_NAME" -PversionCodeOverride="$V_CODE"

      - name: Verify APK signature and name the file
        if: steps.ver.outputs.skip_build != 'true'
        id: apk
        env:
          V_NAME: ${{ steps.ver.outputs.name }}
        run: |
          set -euo pipefail
          apk=$(ls app/build/outputs/apk/release/*.apk | head -n1)
          final="app/build/outputs/apk/release/Bluebird-${V_NAME}.apk"
          [ "$apk" = "$final" ] || mv "$apk" "$final"
          apksigner=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -n1)
          "$apksigner" verify --verbose --print-certs "$final" | tee verify.txt
          sha=$(grep -m1 'certificate SHA-256 digest' verify.txt | awk '{print $NF}')
          echo "path=${final}" >> "$GITHUB_OUTPUT"
          {
            echo "### Bluebird ${V_NAME}"
            echo "Signing certificate SHA-256: \`${sha}\`"
            echo "Compare it with: \`keytool -list -v -keystore <your keystore>\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Release APK artifact
        if: steps.ver.outputs.skip_build != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: bluebird-signed-release-apk
          path: app/build/outputs/apk/release/*.apk
          retention-days: 14

      - name: Publish GitHub Release
        if: steps.ver.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          NEW_NAME: ${{ steps.ver.outputs.name }}
          PREVIOUS: ${{ steps.ver.outputs.previous }}
          APK_PATH: ${{ steps.apk.outputs.path }}
          PRERELEASE: ${{ github.event.inputs.prerelease }}
          NOTES: ${{ github.event.inputs.notes }}
        run: |
          set -euo pipefail
          args=(release create "${NEW_NAME}" "${APK_PATH}" --title "Bluebird ${NEW_NAME}" --verify-tag)
          if [ -n "${NOTES}" ]; then args+=(--notes "${NOTES}")
          elif [ -n "${PREVIOUS}" ]; then args+=(--generate-notes --notes-start-tag "${PREVIOUS}")
          else args+=(--generate-notes); fi
          if [ "${PRERELEASE}" = "true" ]; then args+=(--prerelease); fi
          gh "${args[@]}"

      - name: Clean up keystore and google-services.json
        if: always()
        run: rm -f release.keystore app/google-services.json
