# Single source of truth for the app version.
# The "Build Signed Release APK" workflow rewrites this file on every release and commits it,
# so local Android Studio builds stay in sync.
# versionCode is a simple build number: it goes up by 1 on every release (the last published build is 15,
# so the next release is 16). It does not depend on the version name.
versionName=2.4.0
versionCode=15
